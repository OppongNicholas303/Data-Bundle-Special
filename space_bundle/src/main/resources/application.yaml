spring:
  application:
    name: space-bundle


  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          ssl:
            enable: false
          connectiontimeout: 10000
          timeout: 10000
          writetimeout: 10000

  # MongoDB Configuration
  data:
    mongodb:
      uri: ${MONGO_URI}
      auto-index-creation: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mongo.embedded.EmbeddedMongoAutoConfiguration

  # Disable default security password
  security:
    user:
      name: disabled
      password: disabled

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:1800000} # 30 minutes in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds
  issuer: ${JWT_ISSUER:space-bundle}
  header: Authorization
  prefix: "Bearer "

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: ${INCLUDE_STACKTRACE:never}
    include-exception: false
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
  http2:
    enabled: true
  shutdown: graceful

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
    enabled-by-default: false
  endpoint:
    health:
      enabled: true
      show-details: ${HEALTH_SHOW_DETAILS:when-authorized}
      show-components: ${HEALTH_SHOW_COMPONENTS:when-authorized}
      probes:
        enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mongo:
      enabled: true

# Application Info
info:
  app:
    name: ${spring.application.name}
    description: Space Bundle Application
    version: 0.0.1-SNAPSHOT
    encoding: UTF-8
  java:
    version: 21

# Logging — managed by logback-spring.xml
logging:
  file:
    name: ${LOG_FILE:logs/space-bundle.log}
    max-size: ${LOG_MAX_SIZE:10MB}
    max-history: ${LOG_MAX_HISTORY:30}
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.space: ${LOG_LEVEL_APP:INFO}

# Bot Configuration
bot:
  api:
    url: ${BOT_API_URL}
    urlRandy: ${BOT_API_URL_RANDY}
    token: ${BOT_TOKEN}
    tokenRandy: ${BOT_TOKEN_RANDY}
    timeout: 30000
    login:
      url: https://mydatagigs.com/login/
      username: ${BOT_LOGIN_USERNAME}
      password: ${BOT_LOGIN_PASSWORD}

# Paystack Configuration
paystack:
  secret-key: ${PAYSTACK_SECRET_KEY}
  public-key: ${PAYSTACK_PUBLIC_KEY}
  callback-url: ${PAYSTACK_CALLBACK_URL:http:}

# Frontend Configuration
app:
  frontend-url: ${FRONTEND_URL}
  support-email: ${SUPPORT_EMAIL}
  storefront-base-url: ${STOREFRONT_BASE_URL}



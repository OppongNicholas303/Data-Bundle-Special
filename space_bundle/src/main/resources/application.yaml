spring:
  application:
    name: space-bundle

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        debug: false
        smtp:
          auth: true
          ssl:
            enable: true
          starttls:
            enable: false

  # MongoDB Configuration
  data:
    mongodb:
      uri: ${MONGODB_URI}
      auto-index-creation: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mongo.embedded.EmbeddedMongoAutoConfiguration

  # Disable default security password
  security:
    user:
      name: disabled
      password: disabled

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}
  refresh-expiration: ${JWT_REFRESH_EXPIRATION}
  issuer: space-bundle
  header: Authorization
  prefix: "Bearer "

# Server Configuration
server:
  port: ${SERVER_PORT}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: ${INCLUDE_STACKTRACE:never}
    include-exception: false
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
  http2:
    enabled: true
  shutdown: graceful

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
    enabled-by-default: false
  endpoint:
    health:
      enabled: true
      show-details: ${HEALTH_SHOW_DETAILS:when-authorized}
      show-components: ${HEALTH_SHOW_COMPONENTS:when-authorized}
      probes:
        enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mongo:
      enabled: true

# Application Info
info:
  app:
    name: ${spring.application.name}
    description: Space Bundle Application
    version: 0.0.1-SNAPSHOT
    encoding: UTF-8
  java:
    version: 21

# Logging — managed by logback-spring.xml
logging:
  file:
    name: ${LOG_FILE:logs/space-bundle.log}
    max-size: ${LOG_MAX_SIZE:10MB}
    max-history: ${LOG_MAX_HISTORY:30}
    total-size-cap: ${LOG_TOTAL_SIZE:1GB}

# Moolre configuration
moolre:
  sms:
    api-key: ${MOOLRE_SMS_API_KEY:YOUR_X_API_VASKEY}
    api-url: ${MOOLRE_SMS_API_URL:https://api.moolre.com/open/sms/send}
    price-per-page: ${MOOLRE_SMS_PRICE_PER_PAGE:0.04}
    sender-ids: ${MOOLRE_SMS_SENDER_IDS:Moolre,SpaceBundle}
  api-user: ${MOOLRE_API_USER:adamssaeed}
  pub-key: ${MOOLRE_PUB_KEY}
  private-key: ${MOOLRE_PRIVATE_KEY}
  account-number: ${MOOLRE_ACCOUNT_NUMBER}
  webhook-secret: ${MOOLRE_WEBHOOK_SECRET}
  callback-url: ${MOOLRE_CALLBACK_URL}
  redirect-url: ${MOOLRE_REDIRECT_URL}

# Bot Configuration
bot:
  api:
    url: https://mydatagigs.com/wp-json/custom/v1/place-order
    urlRandy: https://myspaceserver.com/api
    token: ${BOT_API_TOKEN}
    tokenRandy: ${BOT_API_TOKEN_RANDY}
    timeout: 30000
    login:
      url: https://mydatagigs.com/login/
      username: adamssaeed
      password: 00202020KEK@AGA

# LessData Configuration
lessdata:
  base-url: ${LESSDATA_BASE_URL:https://api.lessbundle.com}
  api-key: ${LESSDATA_API_KEY}
  callback-url: ${LESSDATA_CALLBACK_URL:https}

mashup:
  offers:
    url: https://myspaceserver.com/api/external/special-offers/mashup/orders
    timeout-seconds: ${MASHUP_OFFERS_TIMEOUT_SECONDS:8}

# Frontend Configuration
app:
  frontend-url: http://localhost:8081
  support-email: support@tapdata.com
  storefront-base-url: https://tapdata-agent-store.vercel.app/store

# CheckerPort Configuration
checkerport:
  base-url: ${CHECKERPORT_BASE_URL}
  api-key: ${CHECKERPORT_API_KEY}
  webhook-callback-url: ${CHECKERPORT_WEBHOOK_URL}

# Paystack Configuration
paystack:
  secret-key: ${PAYSTACK_SECRET_KEY}
  public-key: ${PAYSTACK_PUBLIC_KEY}
  callback-url: ${PAYSTACK_CALLBACK_URL}

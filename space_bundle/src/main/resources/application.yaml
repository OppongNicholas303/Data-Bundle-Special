spring:
  application:
    name: space-bundle

  # MongoDB Configuration
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb+srv://nicholasoppong2623_db_user:Yaw0243911336@cluster0.arawb0h.mongodb.net/?appName=Cluster0}
      auto-index-creation: true
  autoconfigure:
    exclude: org.springframework.boot.autoconfigure.mongo.embedded.EmbeddedMongoAutoConfiguration

  # Disable default security password
  security:
    user:
      name: disabled
      password: disabled

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:default-jwt-secret-key-change-in-production-minimum-256-bits-required}
  expiration: ${JWT_EXPIRATION:86400000} # 24 hours in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000} # 7 days in milliseconds
  issuer: ${JWT_ISSUER:space-bundle}
  header: Authorization
  prefix: "Bearer "

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: ${INCLUDE_STACKTRACE:never}
    include-exception: false
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
  http2:
    enabled: true
  shutdown: graceful

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
    enabled-by-default: false
  endpoint:
    health:
      enabled: true
      show-details: ${HEALTH_SHOW_DETAILS:when-authorized}
      show-components: ${HEALTH_SHOW_COMPONENTS:when-authorized}
      probes:
        enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mongo:
      enabled: true

# Application Info
info:
  app:
    name: ${spring.application.name}
    description: Space Bundle Application
    version: 0.0.1-SNAPSHOT
    encoding: UTF-8
  java:
    version: 21

# Logging Configuration
logging:
  level:
    root: ${LOG_LEVEL_ROOT:INFO}
    com.space: ${LOG_LEVEL_APP:INFO}
    org.springframework.web: ${LOG_LEVEL_WEB:WARN}
    org.springframework.security: ${LOG_LEVEL_SECURITY:WARN}
    org.springframework.data.mongodb: ${LOG_LEVEL_MONGODB:INFO}
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/space-bundle.log}
    max-size: ${LOG_MAX_SIZE:10MB}
    max-history: ${LOG_MAX_HISTORY:30}
    total-size-cap: ${LOG_TOTAL_SIZE:1GB}

# Bot Configuration
bot:
  api:
    url: ${BOT_API_URL:https://mydatagigs.com/wp-json/custom/v1/place-order}
    timeout: 30000

# Paystack Configuration
paystack:
  secret-key: ${PAYSTACK_SECRET_KEY:sk_test_cb7cbb64518755a53d543b2e90df133c5f415aae}
  public-key: ${PAYSTACK_PUBLIC_KEY:pk_test_302285e48b14699166173b92ebe232b51a70518a}
  callback-url: ${PAYSTACK_CALLBACK_URL:http://localhost:3000/payment/callback}
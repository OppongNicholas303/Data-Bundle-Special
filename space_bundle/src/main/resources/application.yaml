spring:
  application:
    name: space-bundle

  # MongoDB Configuration
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/space_bundle_db}
      # Alternative configuration
      # host: ${MONGO_HOST:localhost}
      # port: ${MONGO_PORT:27017}
      # database: ${MONGO_DATABASE:space_bundle_db}
      # username: ${MONGO_USERNAME:}
      # password: ${MONGO_PASSWORD:}
      # authentication-database: ${MONGO_AUTH_DB:admin}
      auto-index-creation: true

  # Disable default security password
  security:
    user:
      name: disabled
      password: disabled

# JWT Configuration
jwt:
  secret: ${JWT_SECRET:default-jwt-secret-key-change-in-production-minimum-256-bits-required}
  expiration: ${JWT_EXPIRATION:86400000}  # 24 hours in milliseconds
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days in milliseconds
  issuer: ${JWT_ISSUER:space-bundle}
  header: Authorization
  prefix: "Bearer "

# Server Configuration
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api
  error:
    include-message: always
    include-binding-errors: always
    include-stacktrace: never
    include-exception: false
  compression:
    enabled: true
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
  http2:
    enabled: true
  shutdown: graceful

# Actuator Configuration
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
    enabled-by-default: false
  endpoint:
    health:
      enabled: true
      show-details: when-authorized
      show-components: when-authorized
      probes:
        enabled: true
    info:
      enabled: true
    metrics:
      enabled: true
    prometheus:
      enabled: true
  metrics:
    export:
      prometheus:
        enabled: true
    tags:
      application: ${spring.application.name}
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true
    mongo:
      enabled: true
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# Application Info
info:
  app:
    name: ${spring.application.name}
    description: Space Bundle Application
    version: 0.0.1-SNAPSHOT
    encoding: UTF-8
    java:
      version: 21

# Logging Configuration
logging:
  level:
    root: INFO
    com.space: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.data.mongodb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"
  file:
    name: ${LOG_FILE:logs/space-bundle.log}
    max-size: ${LOG_MAX_SIZE:10MB}
    max-history: ${LOG_MAX_HISTORY:30}
    total-size-cap: ${LOG_TOTAL_SIZE:1GB}

# Moolre SMS Configuration
moolre:
  sms:
    api-key: ${MOOLRE_SMS_API_KEY:YOUR_X_API_VASKEY}
    api-url: ${MOOLRE_SMS_API_URL:https://api.moolre.com/open/sms/send}
    price-per-page: ${MOOLRE_SMS_PRICE_PER_PAGE:0.04}
    sender-ids: ${MOOLRE_SMS_SENDER_IDS:Moolre,SpaceBundle}

---
# Development Profile
spring:
  config:
    activate:
      on-profile: dev

  data:
    mongodb:
      uri: mongodb://localhost:27017/space_bundle_dev

jwt:
  secret: dev-secret-key-change-in-production-minimum-256-bits-required-for-hs256
  expiration: 86400000
  refresh-expiration: 604800000

server:
  error:
    include-stacktrace: on_param

management:
  endpoint:
    health:
      show-details: always
      show-components: always

logging:
  level:
    com.space: DEBUG
    org.springframework.security: DEBUG
    org.springframework.data.mongodb: DEBUG

---
# Production Profile
spring:
  config:
    activate:
      on-profile: prod

  data:
    mongodb:
      uri: ${MONGO_URI}

jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION:3600000}  # 1 hour
  refresh-expiration: ${JWT_REFRESH_EXPIRATION:604800000}  # 7 days

server:
  port: ${SERVER_PORT:8080}
  error:
    include-stacktrace: never
    include-message: always

management:
  endpoint:
    health:
      show-details: never

logging:
  level:
    root: WARN
    com.space: INFO
    org.springframework.web: WARN
    org.springframework.security: WARN
    org.springframework.data.mongodb: WARN

---
# Test Profile
spring:
  config:
    activate:
      on-profile: test

  data:
    mongodb:
      uri: mongodb://localhost:27017/space_bundle_test

jwt:
  secret: test-secret-key-for-testing-purposes-only-minimum-256-bits
  expiration: 3600000
  refresh-expiration: 7200000

logging:
  level:
    com.space: DEBUG
    org.springframework.security: DEBUG